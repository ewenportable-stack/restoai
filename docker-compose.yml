version: '3.9'

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: chefai_db
    environment:
      POSTGRES_DB: chefai
      POSTGRES_USER: chefai
      POSTGRES_PASSWORD: chefai_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chefai']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chefai_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: chefai_mail
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
